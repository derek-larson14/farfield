name: Suggest a source
description: Suggest a podcast, channel, feed, or other public source for editorial review.
title: "Source suggestion: "
body:
  - type: input
    id: source
    attributes:
      label: Source URL
      description: Link the podcast, channel, publication, or public feed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What does it add?
      description: A perspective, original evidence, or useful coverage we are missing.
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: One strong example
      description: Link an episode, post, paper, or release worth sampling.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Access or overlap (optional)
      description: Known RSS/transcripts, paywalls, or the same material on another platform. Do not include credentials or private project context.
