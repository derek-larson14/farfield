name: Suggest a source
description: A blog, newsletter, podcast or paper feed Farfield should read.
title: "Source: "
body:
  - type: input
    id: source
    attributes:
      label: Link
      description: The blog, newsletter, podcast or feed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why (optional)
      description: What it adds that the list is missing, in a sentence.
